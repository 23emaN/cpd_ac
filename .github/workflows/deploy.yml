name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: 📂 Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # หากเซิร์ฟเวอร์ของคุณต้องเอาไฟล์ไปไว้ในโฟลเดอร์เฉพาะ (เช่น public_html หรือ htdocs) 
        # ให้เปิดคอมเมนต์บรรทัดข้างล่างแล้วเปลี่ยนชื่อโฟลเดอร์ให้ตรงครับ
        server-dir: /public_html/
        
        # ไฟล์และโฟลเดอร์ที่ไม่ต้องการอัปโหลดขึ้นเซิร์ฟเวอร์
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .github/
          **/.env*
